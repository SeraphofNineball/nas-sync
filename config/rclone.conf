# rclone remote configuration
#
# SETUP INSTRUCTIONS:
# 1. Fill in your share names, usernames, and passwords below.
# 2. Passwords must be obscured using rclone. Run this command on any machine
#    that has rclone installed (or via Docker):
#
#      docker run --rm rclone/rclone obscure YOUR_PASSWORD_HERE
#
#    Paste the output as the value for "pass" below.
#
# 3. Save the file and restart the containers.

[ugreen]
type = smb
host = 192.168.1.196
user = YOUR_UGREEN_USERNAME
pass = YOUR_OBSCURED_UGREEN_PASSWORD
# port = 445  (uncomment if needed)

[wdnas]
type = smb
host = 192.168.1.251
user = YOUR_WDNAS_USERNAME
pass = YOUR_OBSCURED_WDNAS_PASSWORD
# port = 445  (uncomment if needed)
