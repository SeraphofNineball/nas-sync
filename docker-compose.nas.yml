services:
  nas-sync:
    image: ghcr.io/seraphofnineball/nas-sync:latest
    container_name: nas-sync
    restart: unless-stopped
    environment:
      # Container timezone — schedules fire at this wall-clock time and report
      # timestamps render in this zone. Change to your own IANA zone if needed.
      - TZ=America/New_York
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data
      - /volume1:/volume1
      # USB drives auto-mount as sub-mounts under /mnt/@usb (e.g. /mnt/@usb/sde2).
      # rslave propagation makes those appear in the container even when the drive
      # is plugged in or remounted after the container has already started.
      - type: bind
        source: /mnt/@usb
        target: /mnt/@usb
        bind:
          propagation: rslave
